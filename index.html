<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e8" />
    <script>
      (() => {
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem("glosso-theme");
        } catch {}
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "dark" ? "#101419" : "#f4f0e8";
      })();
    </script>
    <meta
      name="description"
      content="The compiler-aligned Glosso language manual and standard library reference."
    />
    <title>Glosso — Language Manual</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
