<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="description" content="The Glosso language manual and standard-library reference, rendered with Glosso and Clay.">
  <script>
    (() => {
      let savedTheme;
      try { savedTheme = localStorage.getItem("glosso-theme"); } catch {}
      const theme = savedTheme === "light" || savedTheme === "dark"
        ? savedTheme
        : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <title>Glosso — Language Manual</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f0e8;
      --sheet: #fffdf8;
      --ink: #171a1f;
      --muted: #6d6b66;
      --line: #d8d1c5;
      --cobalt: #2449d8;
      --tangerine: #e9682d;
      --syntax-comment: #77746e;
      --syntax-string: #397447;
      --syntax-character: #397447;
      --syntax-number: #9b4f15;
      --syntax-constant: #7c4fb0;
      --syntax-keyword: #b43d25;
      --syntax-directive: #8d3bb0;
      --syntax-type: #2449d8;
      --syntax-function: #7650b8;
      --syntax-parameter: #8b4f28;
      --syntax-property: #166b73;
      --syntax-label: #176a8b;
      --syntax-operator: #555d68;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --paper: #101419;
      --sheet: #171c22;
      --ink: #f3f0e8;
      --muted: #a9aaa6;
      --line: #343b43;
      --cobalt: #8da8ff;
      --tangerine: #ff8957;
      --syntax-comment: #768390;
      --syntax-string: #a6da95;
      --syntax-character: #a6da95;
      --syntax-number: #f5a97f;
      --syntax-constant: #eed49f;
      --syntax-keyword: #ff8957;
      --syntax-directive: #c6a0f6;
      --syntax-type: #8da8ff;
      --syntax-function: #c6a0f6;
      --syntax-parameter: #f5bde6;
      --syntax-property: #8bd5ca;
      --syntax-label: #91d7e3;
      --syntax-operator: #cad3f5;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; min-height: 100%; background: var(--paper); }
    body { margin: 0; min-width: 320px; min-height: 100%; overflow-x: hidden; background: var(--paper); color: var(--ink); text-rendering: optimizeLegibility; }
    button, input { font: inherit; }
    button { color: inherit; }
    .topbar { position: sticky; top: 0; z-index: 40; height: 64px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 95%, transparent); backdrop-filter: blur(12px); }
    .topbar-inner { display: flex; align-items: center; gap: 20px; width: min(100%, 1560px); height: 64px; margin: 0 auto; padding: 0 28px; }
    .brand-mark { display: grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; border: 2px solid var(--ink); background: var(--tangerine); font-family: "Cascadia Code", Consolas, monospace; font-weight: 900; box-shadow: 3px 3px 0 var(--ink); cursor: pointer; }
    .brand-name { border: 0; background: transparent; padding: 0; font-family: Georgia, Cambria, "Times New Roman", serif; font-size: 21px; font-weight: 700; cursor: pointer; }
    .topnav { display: flex; align-self: stretch; gap: 4px; margin-left: 10px; }
    .nav-button { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 0 13px; color: var(--muted); font-size: 14px; font-weight: 650; cursor: pointer; }
    .nav-button:hover { color: var(--ink); }
    .nav-button[aria-current] { border-bottom-color: var(--cobalt); color: var(--cobalt); }
    .theme-toggle { display: grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; margin-left: auto; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font-size: 19px; box-shadow: 2px 2px 0 var(--line); cursor: pointer; }
    .global-search { display: flex; align-items: center; gap: 8px; width: min(320px, 32vw); height: 38px; border: 1px solid var(--line); background: var(--sheet); padding: 0 12px; color: var(--muted); box-shadow: 2px 2px 0 var(--line); }
    .global-search:focus-within { border-color: var(--cobalt); box-shadow: 2px 2px 0 var(--cobalt); }
    .global-search input { min-width: 0; flex: 1; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 14px; }
    .global-search input::placeholder { color: var(--muted); }
    .keycap { border: 1px solid var(--line); background: var(--paper); padding: 2px 6px; font-family: "Cascadia Code", Consolas, monospace; font-size: 10px; }
    #app, #scene { position: relative; width: 100%; min-height: calc(100vh - 64px); }
    .native-sidebar { position: fixed; top: 64px; bottom: 0; left: 0; z-index: 25; width: 270px; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; border-right: 1px solid var(--line); background: color-mix(in srgb, var(--paper) 96%, var(--sheet)); scrollbar-color: var(--muted) color-mix(in srgb, var(--line) 52%, transparent); scrollbar-width: auto; }
    .native-sidebar[hidden] { display: none; }
    .native-sidebar::-webkit-scrollbar { width: 16px; }
    .native-sidebar::-webkit-scrollbar-track { background: color-mix(in srgb, var(--line) 52%, transparent); }
    .native-sidebar::-webkit-scrollbar-thumb { border: 3px solid transparent; border-radius: 10px; background: var(--muted); background-clip: padding-box; }
    .native-sidebar-tools { position: sticky; top: 0; z-index: 2; padding: 20px 20px 12px; background: color-mix(in srgb, var(--paper) 96%, var(--sheet)); }
    .native-sidebar-title { margin: 0 0 16px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .18em; line-height: 18px; }
    .native-sidebar-filter { width: 100%; height: 48px; border: 1px solid var(--line); outline: 0; background: var(--sheet); padding: 0 14px; color: var(--ink); font-size: 13px; }
    .native-sidebar-filter::placeholder { color: var(--muted); }
    .native-sidebar-filter:focus { border-color: var(--cobalt); }
    .native-sidebar-index, .native-sidebar-item { display: block; width: 100%; min-height: 48px; border: 0; border-left: 3px solid transparent; background: transparent; padding: 12px 25px; color: var(--muted); text-align: left; line-height: 22px; cursor: pointer; }
    .native-sidebar-index { margin-top: 12px; }
    .native-sidebar-index:hover, .native-sidebar-item:hover { background: color-mix(in srgb, var(--sheet) 58%, transparent); color: var(--ink); }
    .native-sidebar-index[aria-current], .native-sidebar-item[aria-current] { border-left-color: var(--cobalt); background: var(--sheet); color: var(--cobalt); font-weight: 700; }
    .native-sidebar-items { padding-bottom: 24px; }
    .native-sidebar-group { margin-top: 22px; }
    .native-sidebar-group:first-child { margin-top: 10px; }
    .native-sidebar-group-title { margin: 0 20px 8px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .16em; line-height: 18px; text-transform: uppercase; }
    .native-sidebar-group .native-sidebar-item { width: calc(100% - 28px); margin-left: 28px; padding: 9px 18px; }
    .native-sidebar-empty { margin: 8px 24px; color: var(--muted); font-size: 13px; line-height: 22px; }
    .clay-command { position: absolute; margin: 0; padding: 0; transform-origin: top left; pointer-events: none; }
    .clay-text { overflow: hidden; white-space: pre; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
    .tok-comment { color: var(--syntax-comment); font-style: italic; }
    .tok-string { color: var(--syntax-string); }
    .tok-character { color: var(--syntax-character); }
    .tok-number { color: var(--syntax-number); }
    .tok-constant { color: var(--syntax-constant); }
    .tok-keyword { color: var(--syntax-keyword); font-weight: 700; }
    .tok-directive { color: var(--syntax-directive); font-weight: 700; }
    .tok-type { color: var(--syntax-type); }
    .tok-function { color: var(--syntax-function); }
    .tok-parameter { color: var(--syntax-parameter); }
    .tok-property { color: var(--syntax-property); }
    .tok-label { color: var(--syntax-label); }
    .tok-operator { color: var(--syntax-operator); }
    .clay-clip { position: absolute; overflow: hidden; }
    .clay-source-link { color: inherit; text-transform: uppercase; letter-spacing: .07em; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px; cursor: pointer; pointer-events: auto; }
    .clay-source-link:hover { color: var(--cobalt) !important; }
    .clay-code-copy { appearance: none; border: 0; outline: 0; background: transparent; padding: 0; color: inherit; text-align: left; cursor: pointer; pointer-events: auto; }
    .clay-code-copy:hover { color: var(--ink) !important; }
    .clay-code-copy:focus-visible { outline: 1px solid var(--cobalt); outline-offset: 3px; }
    .clay-scrollbar { position: absolute; top: 0; right: 0; z-index: 30; width: 14px; height: 100%; overflow-x: hidden; overflow-y: scroll; background: transparent; }
    .clay-scrollbar::-webkit-scrollbar { width: 12px; }
    .clay-scrollbar::-webkit-scrollbar-track { background: color-mix(in srgb, var(--line) 35%, transparent); }
    .clay-scrollbar::-webkit-scrollbar-thumb { border: 3px solid transparent; border-radius: 9px; background: var(--muted); background-clip: padding-box; }
    .clay-scrollbar-visual { position: absolute; top: 0; right: 2px; z-index: 31; width: 10px; height: 100%; border-radius: 8px; background: color-mix(in srgb, var(--line) 72%, transparent); pointer-events: none; }
    .clay-scrollbar-thumb { position: absolute; left: 0; width: 10px; min-height: 38px; border-radius: 8px; background: var(--muted); opacity: .9; }
    #loading { position: fixed; inset: 64px 0 0; z-index: 50; display: grid; place-items: center; background: var(--paper); color: var(--cobalt); font-size: 12px; font-weight: 800; letter-spacing: .16em; }
    #loading[hidden] { display: none; }
    #error { max-width: 760px; margin: 80px auto; padding: 24px; border: 1px solid var(--line); background: var(--sheet); color: #9c2432; white-space: pre-wrap; }
    #measure, .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    html[data-theme="dark"] .brand-mark { box-shadow: 3px 3px 0 #050709; }
    html[data-theme="dark"] .theme-toggle, html[data-theme="dark"] .global-search { box-shadow: 2px 2px 0 #050709; }
    @media (max-width: 760px) {
      .topbar-inner { gap: 10px; padding: 0 12px; }
      .brand-name, .keycap { display: none; }
      .topnav { margin-left: 0; }
      .nav-button { padding: 0 8px; font-size: 12px; }
      .global-search { width: min(180px, 34vw); }
    }
    @media (max-width: 859px) {
      .native-sidebar { position: absolute; top: 0; bottom: auto; width: 100%; height: 320px; }
    }
    @media (max-width: 520px) {
      .topbar-inner { gap: 7px; }
      .brand-mark { width: 34px; height: 34px; }
      .theme-toggle { width: 34px; height: 34px; }
      .global-search { display: none; }
      .nav-button { padding: 0 7px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <header id="topbar" class="topbar">
    <div class="topbar-inner">
      <button class="brand-mark" type="button" data-view="0" aria-label="Glosso manual home">g.</button>
      <button class="brand-name" type="button" data-view="0">Glosso</button>
      <nav class="topnav" aria-label="Primary navigation">
        <button class="nav-button" type="button" data-view="0">Manual</button>
        <button class="nav-button" type="button" data-view="1">Standard library</button>
        <button class="nav-button" type="button" data-view="2">Search</button>
      </nav>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Use dark mode">☾</button>
      <label class="global-search">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" aria-label="Search Glosso documentation" placeholder="Name or (int, int) -> int">
        <span class="keycap">⌘K</span>
      </label>
      <span id="highlighter-state" class="visually-hidden" aria-live="polite"></span>
    </div>
  </header>
  <main id="app" aria-label="Glosso language manual">
    <aside id="native-sidebar" class="native-sidebar" aria-label="Documentation navigation" hidden>
      <div class="native-sidebar-tools">
        <h2 id="native-sidebar-title" class="native-sidebar-title">CHAPTERS</h2>
        <input id="native-sidebar-filter" class="native-sidebar-filter" type="search" placeholder="Filter chapters…" autocomplete="off">
        <button id="native-sidebar-index" class="native-sidebar-index" type="button">Manual index</button>
      </div>
      <nav id="native-sidebar-items" class="native-sidebar-items" aria-labelledby="native-sidebar-title"></nav>
    </aside>
    <div id="scene"></div>
  </main>
  <div id="loading">COMPILING THE PAGE…</div>
  <canvas id="measure"></canvas>
  <script type="module" src="./app.js"></script>
</body>
</html>
